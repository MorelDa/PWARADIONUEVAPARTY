<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - RADIO PARTY</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); color: #0f172a; display: flex; justify-content: center; align-items: flex-start; padding: 20px; min-height: 100vh; }
    .admin-card { background: #ffffff; width: 100%; max-width: 520px; padding: 28px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
    h1 { font-size: 1.5rem; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; color: #2563eb; }
    .subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 22px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; font-weight: 700; color: #475569; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], input[type="url"] { width: 100%; padding: 12px 14px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 0.9rem; outline: none; transition: border 0.2s; }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
    .btn-group { display: flex; gap: 10px; margin-top: 24px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.9rem; transition: all 0.2s; }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; }
    .status-msg { margin-top: 15px; font-size: 0.85rem; text-align: center; color: #16a34a; font-weight: 600; padding: 10px; border-radius: 8px; background: #dcfce7; display: none; }
    .status-msg.show { display: block; }
    .status-msg.error { color: #dc2626; background: #fee2e2; }
    .preview-logo { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #cbd5e1; margin-top: 6px; display: none; }
    .preview-logo.show { display: block; }
  </style>
</head>
<body>

  <div class="admin-card">
    <h1><i class="fa-solid fa-sliders"></i> Admin Radio</h1>
    <p class="subtitle">Configura los datos de tu emisora. Genera el archivo <code>config.json</code> y súbelo a la raíz del proyecto.</p>

    <div class="form-group">
      <label>Nombre de la Emisora</label>
      <input type="text" id="stationTitle" value="RADIO PARTY">
    </div>

    <div class="form-group">
      <label>Subtítulo / Programa</label>
      <input type="text" id="showName" value="Transmisión Online">
    </div>

    <div class="form-group">
      <label>URL de Streaming (Audio)</label>
      <input type="url" id="streamUrl" value="https://miestacion.turadioonline.com.ar:8286/stream">
    </div>

    <div class="form-group">
      <label>URL del Logo</label>
      <input type="url" id="logoUrl" value="https://i.ibb.co/NgBNjPgh/LOGO.png">
      <img id="logoPreview" class="preview-logo" alt="Preview">
    </div>

    <div class="form-group">
      <label>WhatsApp (URL completa)</label>
      <input type="url" id="whatsappUrl" value="https://wa.me/">
    </div>

    <div class="form-group">
      <label>TikTok (Perfil URL)</label>
      <input type="url" id="tiktokUrl" value="https://tiktok.com">
    </div>

    <div class="form-group">
      <label>Texto para compartir</label>
      <input type="text" id="shareText" value="¡Escucha RADIO PARTY en vivo!">
    </div>

    <div class="btn-group">
      <button class="btn-secondary" onclick="cargarConfigExistente()"><i class="fa-solid fa-rotate"></i> Cargar</button>
      <button class="btn-primary" onclick="descargarJSON()"><i class="fa-solid fa-download"></i> Generar JSON</button>
    </div>

    <div id="statusMsg" class="status-msg"></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const fields = ['stationTitle','showName','streamUrl','logoUrl','whatsappUrl','tiktokUrl','shareText'];

    $('logoUrl').addEventListener('input', (e) => {
      const preview = $('logoPreview');
      preview.src = e.target.value;
      preview.classList.add('show');
      preview.onerror = () => preview.classList.remove('show');
    });

    function showStatus(msg, error = false) {
      const el = $('statusMsg');
      el.textContent = msg;
      el.className = 'status-msg show' + (error ? ' error' : '');
      setTimeout(() => el.classList.remove('show'), 3500);
    }

    function descargarJSON() {
      const config = {};
      fields.forEach((f) => config[f] = $(f).value);
      const dataStr = 'data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(config, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = 'config.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      showStatus('¡config.json generado! Súbelo a la raíz del proyecto.');
    }

    function cargarConfigExistente() {
      fetch('config.json?v=' + Date.now())
        .then((res) => res.json())
        .then((data) => {
          fields.forEach((f) => { if (data[f]) $(f).value = data[f]; });
          if (data.logoUrl) {
            $('logoPreview').src = data.logoUrl;
            $('logoPreview').classList.add('show');
          }
          showStatus('Configuración cargada correctamente.');
        })
        .catch(() => showStatus('No se encontró config.json previo.', true));
    }

    // Auto-load al abrir
    cargarConfigExistente();
  </script>
</body>
</html>
